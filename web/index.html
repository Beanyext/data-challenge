<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="CQA: оценка диалогов, доказательства и пересмотр результатов по чек-листу.">
  <title>CQA · Контроль качества</title>
  <link rel="icon" href="./assets/freedom-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./visual.css">
  <link rel="stylesheet" href="./broker.css">
  <link rel="stylesheet" href="./forms-visual.css">
  <link rel="stylesheet" href="./polish.css">
  <link rel="stylesheet" href="./language.css">
  <link rel="stylesheet" href="./workspace.css">
  <link rel="stylesheet" href="./review.css">
  <link rel="stylesheet" href="./ux.css">
  <link rel="stylesheet" href="./minimal.css">
  <link rel="stylesheet" href="./print.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="К содержимому">К содержимому</a>
  <aside class="sidebar" aria-label="Главное меню" data-i18n-aria="Главное меню">
    <a class="brand" href="#dialogs" aria-label="Freedom CQA, диалоги" data-i18n-aria="Freedom CQA, диалоги"><img class="brand-mark" src="./assets/freedom-mark.svg" width="36" height="40" alt=""><img class="brand-logo" src="./assets/freedom-logo-print.svg" width="168" height="40" alt="Freedom"></a>
    <nav>
      <a href="#dialogs" data-nav="dialogs" title="Диалоги" data-i18n-title="Диалоги"><span class="nav-icon" data-icon="dialogs"></span><span data-i18n="Диалоги">Диалоги</span><span id="dialog-count" class="nav-count"></span></a>
      <a href="#checklists" data-nav="checklists" title="Чек-листы" data-i18n-title="Чек-листы"><span class="nav-icon" data-icon="list"></span><span data-i18n="Чек-листы">Чек-листы</span></a>
      <a href="#appeals" data-nav="appeals" title="Апелляции" data-i18n-title="Апелляции"><span class="nav-icon" data-icon="appeal"></span><span data-i18n="Апелляции">Апелляции</span><span id="appeal-count" class="nav-count"></span></a>
    </nav>
    <div class="sidebar-bottom"><p><span class="prototype-label">SeeUSoon</span><br><span>Data Challenge 2026</span></p><button class="connection-button" data-action="settings"><span class="connection-dot" aria-hidden="true"></span><span id="connection-label">Подключение к серверу</span><span data-icon="settings"></span></button></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div class="topbar-start"><div id="workspace-tools"></div><span class="topbar-parent" data-i18n="Рабочее пространство">Рабочее пространство</span><span class="breadcrumb-sep" aria-hidden="true">/</span><span id="breadcrumb">Диалоги</span></div><div class="topbar-end"><div id="language-switcher"></div><button class="icon-btn" data-action="settings" aria-label="Настройки подключения" title="Настройки подключения" data-i18n-aria="Настройки подключения" data-i18n-title="Настройки подключения" data-icon="settings"></button></div></header>
    <div id="demo-banner" class="demo-banner" hidden><span><strong data-i18n="Учебный пример.">Учебный пример.</strong> <span data-i18n="Вымышленные диалоги и оценки, модель не вызывается.">Вымышленные диалоги и оценки, модель не вызывается.</span></span><button data-action="settings"><span data-i18n="Подключить сервер">Подключить сервер</span> <span aria-hidden="true">↗</span></button></div>
    <div id="job-banner" class="job-banner" role="status" hidden></div>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="notifications" class="notifications" aria-live="polite" aria-atomic="true"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <input type="file" id="upload-file" accept=".json,application/json" hidden>
  <noscript><p lang="ru">Для работы CQA включите JavaScript в браузере.</p><p lang="kk">CQA жұмыс істеуі үшін браузерде JavaScript қосыңыз.</p><p lang="en">Enable JavaScript in your browser to use CQA.</p></noscript>
</body>
</html>
