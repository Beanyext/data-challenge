<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="CQA: оценка диалогов, доказательства и пересмотр результатов по чек-листу.">
  <title>CQA · Контроль качества</title>
  <link rel="icon" href="./assets/freedom-mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./visual.css">
  <link rel="stylesheet" href="./broker.css">
  <link rel="stylesheet" href="./forms-visual.css">
  <script src="./config.js"></script>
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <aside class="sidebar" aria-label="Главное меню">
    <a class="brand" href="#dialogs" aria-label="Freedom CQA, диалоги"><img class="brand-logo" src="./assets/freedom-logo.svg" width="168" height="40" alt="Freedom"><span class="brand-caption">CONVERSATION QUALITY</span></a>
    <div class="workspace-label">КОНТРОЛЬ КАЧЕСТВА <span>CQA</span></div>
    <nav>
      <a href="#dialogs" data-nav="dialogs"><span class="nav-icon" data-icon="dialogs"></span>Диалоги<span id="dialog-count" class="nav-count"></span></a>
      <a href="#checklists" data-nav="checklists"><span class="nav-icon" data-icon="list"></span>Чек-листы</a>
      <a href="#appeals" data-nav="appeals"><span class="nav-icon" data-icon="appeal"></span>Апелляции<span id="appeal-count" class="nav-count"></span></a>
    </nav>
    <div class="sidebar-bottom"><div class="workspace-signature"><span data-icon="shield"></span><span>Conversation<br><strong>Quality Analytics</strong></span></div><p>Прототип команды<br><span>Data Challenge 2026</span></p><button class="connection-button" data-action="settings"><span class="connection-dot" aria-hidden="true"></span><span id="connection-label">Подключение к серверу</span><span data-icon="settings"></span></button></div>
  </aside>
  <div class="app-shell">
    <header class="topbar"><div><span class="topbar-parent">Рабочее пространство</span><span class="breadcrumb-sep" aria-hidden="true">/</span><span id="breadcrumb">Диалоги</span></div><div class="topbar-end"><span id="mode-label" class="mode-label">API команды</span><button class="icon-btn" data-action="settings" aria-label="Настройки подключения" title="Настройки подключения" data-icon="settings"></button><span class="avatar" title="Рабочее пространство без авторизации" aria-hidden="true">QA</span></div></header>
    <div id="demo-banner" class="demo-banner" hidden><span><strong>Учебный пример.</strong> Вымышленные диалоги и оценки, модель не вызывается.</span><button data-action="settings">Подключить сервер <span aria-hidden="true">↗</span></button></div>
    <div id="job-banner" class="job-banner" role="status" hidden></div>
    <main id="main" tabindex="-1"></main>
  </div>
  <div id="notifications" class="notifications" aria-live="polite" aria-atomic="true"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <input type="file" id="upload-file" accept=".json,application/json" hidden>
  <noscript><p>Для работы CQA включите JavaScript в браузере.</p></noscript>
</body>
</html>
